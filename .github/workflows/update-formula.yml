name: update-formula

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Optional tag description for the run"
        required: false
  repository_dispatch:
    types: [vectrune-release]
  release:
    types: [published]

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tap
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run update script
        id: updater
        env:
          GITHUB_TOKEN: ${{ secrets.VECTRUNE_RELEASE_TOKEN != '' && secrets.VECTRUNE_RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          python update_formula.py
          VERSION=$(python - <<'PY'
          import pathlib, re
          text = pathlib.Path("vectrune.rb").read_text()
          match = re.search(r'version "(.*?)"', text)
          print(match.group(1) if match else "")
          PY
          )
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Commit changes
        id: commit
        run: |
          if git diff --quiet --exit-code; then
            echo "committed=false" >> "$GITHUB_OUTPUT"
            echo "No changes detected" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add vectrune.rb
          git commit -m "chore: bump vectrune to ${{ steps.updater.outputs.version }}"
          echo "committed=true" >> "$GITHUB_OUTPUT"

      - name: Push changes
        if: steps.commit.outputs.committed == 'true'
        run: |
          git push origin HEAD
          echo "Bumped to version ${{ steps.updater.outputs.version }}" >> "$GITHUB_STEP_SUMMARY"
